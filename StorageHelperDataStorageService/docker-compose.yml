services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: storage-helper-db-${APP_ENV:-local}
    # Only start postgres in LOCAL mode (has profile 'local')
    profiles:
      - local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: storage_helper
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - postgres_data_${APP_ENV:-local}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storage-network

  storage-helper-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage-helper-api-${APP_ENV:-local}
    ports:
      - "8000:8000"
    env_file:
      # Load the appropriate .env file based on APP_ENV
      - .env.${APP_ENV:-local}
    environment:
      # APP_ENV is passed from shell (local or preprod)
      - APP_ENV=${APP_ENV:-local}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=false
    volumes:
      - ./app:/app/app
      - ./tmp:/app/tmp
      # Mount .env file so config.py can verify its existence (optional for DataStorage, but good practice)
      - ./.env.${APP_ENV:-local}:/app/.env.${APP_ENV:-local}:ro
    # Only depend on postgres in LOCAL mode
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks:
      - storage-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data_local:
  postgres_data_preprod:

networks:
  storage-network:
    driver: bridge
    name: storagehelperdatastorageservice_storage-network-${APP_ENV:-local}
