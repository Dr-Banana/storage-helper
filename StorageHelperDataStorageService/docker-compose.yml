version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: storage-helper-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: storage_helper
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storage-network

  storage-helper-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage-helper-api
    ports:
      - "8000:8000"
    # Load environment variables from files if they exist
    # Docker uses the first value found, so preprod overrides local if both exist
    env_file:
      - .env.local
      - .env.preprod
      - .env.prod
    environment:
      # Allow overriding via shell environment variables
      - APP_ENV=${APP_ENV:-local}
      # Default fallbacks if not in .env files
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:root@postgres:5432/storage_helper}
      - STORAGE_LOCAL_PATH=${STORAGE_LOCAL_PATH:-./tmp}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=false
    volumes:
      - ./app:/app/app
      - ./tmp:/app/tmp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - storage-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:

networks:
  storage-network:
    driver: bridge
