services:
  ai-orchestra-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage-helper-ai-orchestra-${APP_ENV:-local}
    ports:
      - "8888:8888"
    environment:
      # APP_ENV is passed from shell (local or preprod)
      - APP_ENV=${APP_ENV:-local}
    env_file:
      # Load the appropriate .env file based on APP_ENV
      - .env.${APP_ENV:-local}
    volumes:
      - ./app:/app/app
      - ./tmp:/app/tmp
      # Mount .env file so config.py can verify its existence
      - ./.env.${APP_ENV:-local}:/app/.env.${APP_ENV:-local}:ro
    restart: unless-stopped
    networks:
      - storage-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  storage-network:
    external: true
    name: storagehelperdatastorageservice_storage-network-${APP_ENV:-local}
