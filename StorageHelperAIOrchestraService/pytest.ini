[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Beautiful and informative output
addopts = 
    --tb=short
    --disable-warnings
    --color=yes
    --strict-markers
    -ra
    --showlocals
    -q

# Test collection
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Console output options
console_output_style = progress

# Filter known compatibility warnings from third-party libraries
filterwarnings =
    # PyMuPDF/fitz warnings in Python 3.12
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
    # httplib2 deprecation warnings
    ignore::DeprecationWarning:httplib2.*
    # protobuf deprecation warnings
    ignore:The argument `including_default_value_fields` has been removed:DeprecationWarning:proto.*

# Markers
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    slow: marks tests as slow (deselect with '-m "not slow"')

