name: AI Orchestra Service Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'StorageHelperAIOrchestraService/**'
      - '.github/workflows/StorageHelperAIOrchestraService.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'StorageHelperAIOrchestraService/**'
      - '.github/workflows/StorageHelperAIOrchestraService.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr libtesseract-dev

    - name: Install Python Dependencies
      run: |
        cd StorageHelperAIOrchestraService
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ── Layer 1 & 2: Structural + Assertion tests (fully offline, no API key) ──
    - name: Run Offline Tests (Structural + Assertion + Semantic-offline)
      env:
        APP_ENV: prod
        GEMINI_LLM_MODEL: gemini-2.5-flash
        GEMINI_EMBEDDING_MODEL: gemini-embedding-001
        GEMINI_METADATA_MODEL: gemini-2.5-flash
        VISION_MODEL: gemini-2.5-flash
        STORAGE_SERVICE_URL: http://localhost:8000/api/v1
        # Placeholder keys — all HTTP calls are mocked in offline tests.
        GEMINI_LLM_API_KEY: placeholder
        GEMINI_EMBEDDING_API_KEY: placeholder
      run: |
        cd StorageHelperAIOrchestraService
        python -m pytest tests/ -m "not llm_judge and not embedding and not llm_live" -v

    # ── Check whether the LLM testing secret is available ─────────────────────
    # secrets.* cannot be used directly in `if:` conditions; use a step output.
    - name: Check LLM testing key availability
      id: check_llm_key
      run: |
        if [ -n "$LLM_TESTING_KEY" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        LLM_TESTING_KEY: ${{ secrets.GEMINI_LLM_TESTING_KEY }}

    # ── Layer 3 (llm_live): Live generation / date-detection / e2e tests ──────
    # All tests marked @pytest.mark.llm_live across the entire suite.
    # Skipped automatically when GEMINI_LLM_TESTING_KEY secret is not configured.
    - name: Run Live LLM Tests (llm_live)
      if: steps.check_llm_key.outputs.available == 'true'
      env:
        APP_ENV: prod
        GEMINI_LLM_MODEL: gemini-2.5-flash
        GEMINI_EMBEDDING_MODEL: gemini-embedding-001
        GEMINI_METADATA_MODEL: gemini-2.5-flash
        VISION_MODEL: gemini-2.5-flash
        STORAGE_SERVICE_URL: http://localhost:8000/api/v1
        # GEMINI_LLM_TESTING_KEY → picked up by _load_testing_key() (auto-enables tests)
        # GEMINI_LLM_API_KEY     → used by settings.GEMINI_LLM_API_KEY for real API calls
        GEMINI_LLM_TESTING_KEY: ${{ secrets.GEMINI_LLM_TESTING_KEY }}
        GEMINI_LLM_API_KEY: ${{ secrets.GEMINI_LLM_TESTING_KEY }}
        GEMINI_EMBEDDING_API_KEY: placeholder
      run: |
        cd StorageHelperAIOrchestraService
        python -m pytest tests/ -m llm_live --run-llm -v
      # LLM output is non-deterministic; don't fail the entire build on flakiness.
      continue-on-error: true

    # ── Layer 3 (llm_judge): LLM-as-Judge semantic quality tests ─────────────
    # Skipped automatically when GEMINI_LLM_TESTING_KEY secret is not configured.
    - name: Run LLM Judge Tests (llm_judge)
      if: steps.check_llm_key.outputs.available == 'true'
      env:
        APP_ENV: prod
        GEMINI_LLM_MODEL: gemini-2.5-flash
        GEMINI_METADATA_MODEL: gemini-2.5-flash
        VISION_MODEL: gemini-2.5-flash
        STORAGE_SERVICE_URL: http://localhost:8000/api/v1
        GEMINI_LLM_TESTING_KEY: ${{ secrets.GEMINI_LLM_TESTING_KEY }}
        GEMINI_LLM_API_KEY: ${{ secrets.GEMINI_LLM_TESTING_KEY }}
        GEMINI_EMBEDDING_API_KEY: placeholder
      run: |
        cd StorageHelperAIOrchestraService
        python -m pytest tests/ai_quality/test_semantic.py -m llm_judge --run-llm -v
      # LLM output is non-deterministic; don't fail the entire build on flakiness.
      continue-on-error: true
