name: AI Orchestra Service Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'StorageHelperAIOrchestraService/**'
      - '.github/workflows/ai-orchestra-service.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'StorageHelperAIOrchestraService/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr libtesseract-dev

    - name: Install Python Dependencies
      run: |
        cd StorageHelperAIOrchestraService
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests
      env:
        # All unit tests mock HTTP calls — no real API key needed.
        # pydantic-settings reads these env vars directly (no .env.prod file in CI).
        APP_ENV: prod
        GEMINI_LLM_MODEL: gemini-2.5-flash
        GEMINI_EMBEDDING_MODEL: gemini-embedding-001
        GEMINI_METADATA_MODEL: gemini-2.5-flash
        VISION_MODEL: gemini-2.5-flash
        STORAGE_SERVICE_URL: http://localhost:8000/api/v1
      run: |
        cd StorageHelperAIOrchestraService
        python -m pytest tests/ -m "not llm_judge and not embedding"

    - name: Run LLM Judge Tests (requires GEMINI_LLM_TESTING_KEY secret)
      # Skipped automatically when the secret is not configured.
      if: ${{ secrets.GEMINI_LLM_TESTING_KEY != '' }}
      env:
        APP_ENV: prod
        GEMINI_LLM_MODEL: gemini-2.5-flash
        GEMINI_LLM_API_KEY: ${{ secrets.GEMINI_LLM_TESTING_KEY }}
        STORAGE_SERVICE_URL: http://localhost:8000/api/v1
      run: |
        cd StorageHelperAIOrchestraService
        python -m pytest tests/ai_quality/test_semantic.py -m llm_judge --run-llm -v
      continue-on-error: true  # LLM output is non-deterministic; don't fail the build

